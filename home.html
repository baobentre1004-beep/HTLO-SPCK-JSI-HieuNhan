<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa Hàng - GamingShop</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f0f7ff 0%, #f8fafc 50%, #f5f3ff 100%);
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar Glassmorphism */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    main {
      flex: 1;
    }

    /* Khung thông điệp hôm nay */
    .quote-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #4f46e5;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.05);
    }

    /* Lưới hiển thị món đồ */
    .grid-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .card-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.1);
      border-color: #cbd5e1;
    }

    .card-item img {
      height: 200px;
      width: 100%;
      object-fit: cover;
      background-color: #f8fafc;
    }

    .btn-main {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      padding: 9px 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    .btn-main:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      color: #ffffff;
    }

    .btn-sub {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-weight: 600;
      padding: 9px 14px;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn-sub:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    footer {
      background: #ffffff;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      padding: 20px 0;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header class="py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="home.html" class="brand-logo text-decoration-none fs-4 d-flex align-items-center gap-2">
        <i class="bi bi-controller fs-3 text-primary"></i> GamingShop
      </a>
      <div class="d-flex gap-2">
        <a href="cart.html" class="btn btn-main rounded-pill px-3 d-flex align-items-center gap-1">
          <i class="bi bi-bag"></i> Giỏ hàng (<span id="cart-count">0</span>)
        </a>
      </div>
    </div>
  </header>

  <main class="container my-4">

    <!-- Thông điệp từ API ngoài -->
    <div class="p-3 mb-4 quote-box">
      <div class="small fw-bold text-uppercase mb-1" style="color: #4f46e5;">
        <i class="bi bi-quote me-1"></i> Lời nhắn hôm nay
      </div>
      <div id="api-text" class="fst-italic text-secondary">Đang tải...</div>
    </div>

    <!-- Danh sách toàn bộ sản phẩm -->
    <h5 class="fw-bold mb-3 text-dark">Tất cả sản phẩm</h5>
    <div class="grid-box" id="item-list">
      <div class="text-secondary py-3">Đang nạp danh sách món đồ...</div>
    </div>

  </main>

  <footer>
    <div class="container text-center small">
      <span>&copy; Cửa Hàng Phụ Kiện Máy Tính</span>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="products.js"></script>

  <!-- SCRIPT CỰC KỲ GỌN: 2 NHIỆM VỤ RÕ RÀNG -->
  <script>
    // 1. LẤY LỜI NHẮN TỪ INTERNET
    fetch("https://api.adviceslip.com/advice")
      .then(res => res.json())
      .then(data => {
        document.getElementById("api-text").textContent = `"${data.slip.advice}"`;
      })
      .catch(() => {
        document.getElementById("api-text").textContent = "Chúc bạn một ngày học tập thật tốt.";
      });

    // 2. LẤY TOÀN BỘ SẢN PHẨM TỪ KHO VẼ RA WEB
    async function loadItems() {
      const snap = await productsCol.get(); // Lấy tất cả đồ trong kho Firestore
      const container = document.getElementById("item-list");
      let html = "";

      snap.forEach(doc => {
        const p = doc.data();
        html += `
          <div class="card-item">
            <img src="${p.img}" alt="${p.name}">
            <div class="p-3 d-flex flex-column justify-content-between flex-grow-1">
              <div>
                <h6 class="fw-bold text-dark mb-1">${p.name}</h6>
                <div class="fw-bold fs-5 mb-3" style="color: #4f46e5;">${Number(p.price).toLocaleString()} đ</div>
              </div>
              <div class="d-flex flex-column gap-2">
                <a href="detail.html?id=${doc.id}" class="btn btn-sub">Xem chi tiết</a>
                <button onclick="addToCart('${doc.id}')" class="btn btn-main">Thêm vào giỏ</button>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    loadItems();
  </script>

  <!-- TÍCH HỢP BONG BÓNG CHAT CHATBASE -->
  <script>
    window.embeddedChatbotConfig = {
      chatbotId: "6MD8BXuVW09VaIQTAyoTh",
      domain: "www.chatbase.co"
    }
  </script>
  <script
    src="https://www.chatbase.co/embed.min.js"
    chatbotId="6MD8BXuVW09VaIQTAyoTh"
    domain="www.chatbase.co"
    defer>
  </script>

</body>
</html>
