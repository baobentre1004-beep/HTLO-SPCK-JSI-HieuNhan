<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Cửa Hàng</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 50%, #fce7f3 100%);
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 12px;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
    }

    .form-control, .input-group-text {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    .input-group-text {
      border-right: none;
      color: #64748b;
    }

    .form-control {
      border-left: none;
      font-size: 0.95rem;
    }

    .form-control:focus {
      background-color: #fff;
      box-shadow: none;
      border-color: #6366f1;
    }

    .input-group:focus-within .input-group-text {
      border-color: #6366f1;
      color: #4f46e5;
      background-color: #fff;
    }

    .btn-main {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    }

    .btn-main:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
    }

    .btn-google {
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background-color: #ffffff;
      color: #334155;
      font-weight: 500;
      padding: 10px;
      transition: all 0.2s;
    }

    .btn-google:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      color: #0f172a;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-icon">
        <i class="bi bi-controller"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Chào mừng trở lại!</h3>
      <p class="text-secondary small mb-0">Đăng nhập tài khoản để tiếp tục mua sắm</p>
    </div>

    <div class="input-group mb-3">
      <span class="input-group-text ps-3"><i class="bi bi-envelope"></i></span>
      <input type="email" id="email" class="form-control py-2 pe-3" placeholder="Nhập email của bạn">
    </div>

    <div class="input-group mb-4">
      <span class="input-group-text ps-3"><i class="bi bi-lock"></i></span>
      <input type="password" id="password" class="form-control py-2 pe-3" placeholder="Nhập mật khẩu">
    </div>

    <button class="btn btn-main w-100 mb-3" onclick="login()">
      Đăng nhập
    </button>

    <div class="d-flex align-items-center mb-3">
      <hr class="flex-grow-1 my-0 text-muted opacity-25">
      <span class="px-2 text-muted small">hoặc</span>
      <hr class="flex-grow-1 my-0 text-muted opacity-25">
    </div>

    <button class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2 mb-4" onclick="loginGoogle()">
      <i class="bi bi-google text-danger fs-5"></i> Đăng nhập bằng Google
    </button>

    <p class="text-center text-secondary small mb-0">
      Chưa có tài khoản? <a href="register.html" class="fw-semibold text-decoration-none" style="color: #4f46e5;">Đăng ký ngay</a>
    </p>
  </div>

  <!-- Đồng bộ phiên bản 10.12.0 với toàn bộ dự án -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="products.js"></script>

  <script>
    // Email quy ước làm Quản trị viên
    const ADMIN_EMAIL = "admin@gamingshop.com";

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email.includes("@")) {
        alert("Email chưa hợp lệ");
        return;
      }

      if (password.length < 6) {
        alert("Mật khẩu phải có ít nhất 6 ký tự");
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          // PHÂN QUYỀN ĐIỀU HƯỚNG
          if (user.email === ADMIN_EMAIL) {
            alert("Đăng nhập tài khoản Quản trị viên thành công!");
            window.location.href = "admin.html";
          } else {
            alert("Đăng nhập thành công!");
            window.location.href = "index.html";
          }
        })
        .catch((error) => {
          alert("Lỗi đăng nhập: " + error.message);
        });
    }

    function loginGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();

      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;

          if (user.email === ADMIN_EMAIL) {
            alert("Đăng nhập tài khoản Quản trị viên thành công!");
            window.location.href = "admin.html";
          } else {
            alert("Đăng nhập thành công!");
            window.location.href = "index.html";
          }
        })
        .catch((error) => {
          alert("Lỗi: " + error.message);
        });
    }
  </script>

</body>

</html>
