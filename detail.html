<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Món Đồ - GamingShop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f0f7ff 0%, #f8fafc 50%, #f5f3ff 100%);
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar Glassmorphism */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    main {
      flex: 1;
    }

    /* Khung chi tiết sản phẩm */
    .detail-card {
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
      padding: 32px;
    }

    .img-wrapper {
      background-color: #f8fafc;
      border-radius: 16px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-img {
      width: 100%;
      max-height: 380px;
      border-radius: 12px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .detail-img:hover {
      transform: scale(1.02);
    }

    /* Nút chính gradient */
    .btn-main {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    }

    .btn-main:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
    }

    /* Nút quay lại / phụ */
    .btn-back {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #475569;
      font-weight: 500;
      border-radius: 50px;
      padding: 8px 18px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .badge-policy {
      background-color: #f1f5f9;
      color: #475569;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
    }

    footer {
      background: #ffffff;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      padding: 20px 0;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header class="py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="btn btn-back d-inline-flex align-items-center gap-1">
        <i class="bi bi-arrow-left"></i> Quay lại danh sách
      </a>
      <a href="cart.html" class="btn btn-main rounded-pill px-3 d-inline-flex align-items-center gap-1">
        <i class="bi bi-bag"></i> Giỏ hàng (<span id="cart-count">0</span>)
      </a>
    </div>
  </header>

  <main class="container my-5">
    <div class="detail-card" id="detail-box">
      <div class="text-center py-5 text-secondary">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <div>Đang tải thông tin món đồ...</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center small">
      <span>&copy; Cửa Hàng Phụ Kiện Máy Tính - Uy tín & Chất lượng</span>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="products.js"></script>

  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const box = document.getElementById("detail-box");

    async function loadItem() {
      // Lấy trực tiếp sản phẩm từ Firestore theo ID
      const doc = await productsCol.doc(id).get();
      const p = doc.data();

      // Hiển thị dữ liệu ra màn hình
      box.innerHTML = `
        <div class="row align-items-center g-4">
          <div class="col-md-6">
            <div class="img-wrapper">
              <img src="${p.img}" alt="${p.name}" class="detail-img">
            </div>
          </div>
          <div class="col-md-6">
            <span class="badge bg-light text-primary border px-2 py-1 mb-2">Chính Hãng</span>
            <h2 class="fw-bold text-dark mb-2">${p.name}</h2>
            <div class="fs-3 fw-bold mb-3" style="color: #4f46e5;">${Number(p.price).toLocaleString()} đ</div>
            <p class="text-secondary leading-relaxed mb-4">${p.desc || "Món đồ bền bỉ, thiết kế tối ưu và dễ sử dụng cho góc làm việc của bạn."}</p>
            
            <div class="row g-2 mb-4">
              <div class="col-6">
                <div class="badge-policy d-flex align-items-center gap-2">
                  <i class="bi bi-shield-check text-primary fs-5"></i>
                  <span>Bảo hành 12 tháng</span>
                </div>
              </div>
              <div class="col-6">
                <div class="badge-policy d-flex align-items-center gap-2">
                  <i class="bi bi-truck text-primary fs-5"></i>
                  <span>Giao hàng toàn quốc</span>
                </div>
              </div>
            </div>

            <button onclick="addToCart('${id}')" class="btn btn-main btn-lg w-100 d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-bag-plus"></i> Thêm vào giỏ hàng
            </button>
          </div>
        </div>
      `;
    }

    loadItem();
  </script>

</body>
</html>
